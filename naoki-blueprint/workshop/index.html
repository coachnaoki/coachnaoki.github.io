<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  overflow-anchor: none;
  overscroll-behavior-y: none;
  scroll-behavior: auto;
}

body {
  min-height: 100%;
  margin: 0;
  overflow-anchor: none;
  overscroll-behavior-y: none;
}

.lp-shell {
  width: min(100%, 860px);
  margin: 0 auto;
}

.lp-image {
  line-height: 0;
}

.slice {
  display: block;
  width: 100%;
  height: auto;
}

.cta-image-wrap {
  position: relative;
}

.image-cta-hotspot {
  position: absolute;
  display: block;
}

.student-results {
  padding: 16px 18px 26px;
  border-top: 1px solid rgba(37, 99, 235, 0.16);
  border-bottom: 1px solid rgba(37, 99, 235, 0.16);
}

.comparison-block,
.result-list {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.comparison-block {
  margin-bottom: 14px;
}

.video-card {
  overflow: hidden;
  border: 1px solid rgba(37, 99, 235, 0.22);
  border-radius: 8px;
}

.video-label {
  display: flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  padding: 10px 12px;
  font-size: 18px;
  font-weight: 800;
  line-height: 1.2;
  text-align: center;
}

.video-label--profile {
  flex-direction: column;
  gap: 6px;
  min-height: 72px;
  padding: 14px 12px 13px;
  font-size: 24px;
}

.profile-link {
  font-size: 17px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.source-toggle {
  border-top: 1px solid rgba(37, 99, 235, 0.22);
}

.source-toggle summary {
  display: flex;
  min-height: 68px;
  align-items: center;
  justify-content: center;
  padding: 16px 18px;
  cursor: pointer;
  font-size: 24px;
  font-weight: 900;
  line-height: 1.2;
  list-style: none;
}

.source-toggle summary::-webkit-details-marker {
  display: none;
}

.source-toggle summary::after {
  content: "+";
  display: inline-flex;
  width: 28px;
  height: 28px;
  align-items: center;
  justify-content: center;
  margin-left: 12px;
  border-radius: 999px;
  font-size: 22px;
  line-height: 1;
}

.source-toggle[open] summary::after {
  content: "-";
}

video {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
}

.fixed-cta-layer {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.fixed-cta {
  position: absolute;
  right: 50%;
  bottom: 18px;
  display: block;
  width: min(calc(100% - 24px), 760px);
  transform: translateX(50%);
  line-height: 0;
  pointer-events: auto;
}

.fixed-cta img {
  display: block;
  width: 100%;
  height: auto;
}
</style>
<script>
(() => {
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  if (window.location.hash) {
    return;
  }

  const resetScroll = () => window.scrollTo(0, 0);
  resetScroll();
  window.addEventListener("DOMContentLoaded", resetScroll, { once: true });
  window.addEventListener("load", resetScroll, { once: true });
  window.addEventListener("pageshow", resetScroll, { once: true });
})();
</script>

<script>
(() => {
  const fixedCtaLayer = document.querySelector(".fixed-cta-layer");
  const finalCtaHotspot = document.querySelector(".image-cta-hotspot--final");

  if (!fixedCtaLayer || !finalCtaHotspot) {
    return;
  }

  const setFixedCtaHidden = (isHidden) => {
    fixedCtaLayer.classList.toggle("is-hidden", isHidden);
    fixedCtaLayer.setAttribute("aria-hidden", isHidden ? "true" : "false");
  };

  const updateFixedCta = () => {
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const finalCtaRect = finalCtaHotspot.getBoundingClientRect();
    const pageBottom = document.documentElement.scrollHeight - 2;
    const currentBottom = window.scrollY + viewportHeight;
    const finalCtaVisible = finalCtaRect.top < viewportHeight - 12 && finalCtaRect.bottom > 12;

    setFixedCtaHidden(finalCtaVisible || currentBottom >= pageBottom);
  };

  let ticking = false;
  const requestUpdate = () => {
    if (ticking) {
      return;
    }

    ticking = true;
    window.requestAnimationFrame(() => {
      updateFixedCta();
      ticking = false;
    });
  };

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);
  updateFixedCta();
})();
</script>

<script>
(() => {
  const isViewportAtTop = () => window.scrollY <= 0;
  const isViewportAtBottom = () => (
    window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 1
  );

  const shouldBlockViewportOverscroll = (deltaY) => (
    (deltaY < 0 && isViewportAtTop()) ||
    (deltaY > 0 && isViewportAtBottom())
  );

  window.addEventListener("wheel", (event) => {
    if (shouldBlockViewportOverscroll(event.deltaY)) {
      event.preventDefault();
    }
  }, { passive: false });

  let lastTouchY = null;

  window.addEventListener("touchstart", (event) => {
    lastTouchY = event.touches.length ? event.touches[0].clientY : null;
  }, { passive: true });

  window.addEventListener("touchmove", (event) => {
    if (lastTouchY === null || !event.touches.length) {
      return;
    }

    const currentTouchY = event.touches[0].clientY;
    const deltaY = lastTouchY - currentTouchY;
    lastTouchY = currentTouchY;

    if (shouldBlockViewportOverscroll(deltaY)) {
      event.preventDefault();
    }
  }, { passive: false });

  window.addEventListener("touchend", () => {
    lastTouchY = null;
  }, { passive: true });
})();
</script>
