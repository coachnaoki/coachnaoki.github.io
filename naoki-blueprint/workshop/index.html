<script>
(() => {
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }

  if (window.location.hash) {
    return;
  }

  const resetScroll = () => window.scrollTo(0, 0);
  resetScroll();
  window.addEventListener("DOMContentLoaded", resetScroll, { once: true });
  window.addEventListener("load", resetScroll, { once: true });
  window.addEventListener("pageshow", resetScroll, { once: true });
})();
</script>

<div class="fixed-cta-layer" aria-hidden="false">

    aria-label="審査エントリーする"
  >
    <img src="assets/images/fixed-cta.png" width="841" height="150" alt="審査エントリーする" />
  </a>
</div>

<script>
(() => {
  const fixedCtaLayer = document.querySelector(".fixed-cta-layer");
  const finalCtaHotspot = document.querySelector(".image-cta-hotspot--final");

  if (!fixedCtaLayer || !finalCtaHotspot) {
    return;
  }

  const setFixedCtaHidden = (isHidden) => {
    fixedCtaLayer.classList.toggle("is-hidden", isHidden);
    fixedCtaLayer.setAttribute("aria-hidden", isHidden ? "true" : "false");
  };

  const updateFixedCta = () => {
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const finalCtaRect = finalCtaHotspot.getBoundingClientRect();
    const pageBottom = document.documentElement.scrollHeight - 2;
    const currentBottom = window.scrollY + viewportHeight;
    const finalCtaVisible = finalCtaRect.top < viewportHeight - 12 && finalCtaRect.bottom > 12;

    setFixedCtaHidden(finalCtaVisible || currentBottom >= pageBottom);
  };

  let ticking = false;
  const requestUpdate = () => {
    if (ticking) {
      return;
    }

    ticking = true;
    window.requestAnimationFrame(() => {
      updateFixedCta();
      ticking = false;
    });
  };

  window.addEventListener("scroll", requestUpdate, { passive: true });
  window.addEventListener("resize", requestUpdate);
  updateFixedCta();
})();
</script>
