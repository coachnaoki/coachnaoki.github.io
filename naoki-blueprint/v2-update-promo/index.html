<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="refresh" content="0; url=../workshop/" />
<title>Workshopへ移動しました</title>
<link rel="canonical" href="https://coachnaoki.github.io/naoki-blueprint/workshop/" />
<script>
(() => {
  const nextUrl = new URL("../workshop/", window.location.href);
  nextUrl.search = window.location.search;
  nextUrl.hash = window.location.hash;
  window.location.replace(nextUrl);
})();
</script>
</head>
<body>
<p><a href="../workshop/">Workshopページへ移動します</a></p>
</body>
</html>
